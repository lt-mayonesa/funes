<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" version="1.1">
  <!--
    Funes app icon — Papirus design guidelines compliant (48px).

    Layer order (dark → light):
      1. Drop shadows  (pure black, 20% opacity, +1px down)
      2. Clipboard body  (#7a8c5a warm olive, within Papirus [#4f4f4f–#e4e4e4] range)
      3. Body highlight  (white 20%, top ~2px strip)
      4. Clipboard clip  (#afafb1 steel with ring cutout, evenodd)
      5. Clip highlight  (white 15%)
      6. Ceibo leaf mark  (white body + olive spine + olive lateral veins)

    No gradients. Flat colours. Shadow offset: 1px.
    Design area: 40×40 centred in 48×48 (4px margin each side).
  -->

  <!-- 1. Drop shadows (black 20%, offset +1px) -->
  <rect style="opacity:0.2" x="8" y="13" width="32" height="32" rx="2" ry="2"/>
  <path style="opacity:0.2"
        d="M 24 5 C 22.9 5 21.8 5.31 20.7 6.25 L 14 11.33 L 14 13 L 34 13
           L 34 11.33 L 27.3 6.25 C 26.1 5.25 25 5 24 5 Z"/>

  <!-- 2. Clipboard body (warm olive #7a8c5a) -->
  <rect style="fill:#7a8c5a" x="8" y="12" width="32" height="32" rx="2" ry="2"/>

  <!-- 3. Body highlight (white 20%, thin top strip) -->
  <path style="fill:#ffffff;opacity:0.2"
        d="M 10 12 Q 8 12 8 14 L 8 15 Q 8 12 10 12 L 38 12 Q 40 12 40 14 L 40 15 Q 40 12 38 12 Z"/>

  <!-- 4. Clipboard clip (#afafb1 steel, ring cutout via evenodd) -->
  <path style="fill:#afafb1" fill-rule="evenodd"
        d="M 24 4 C 22.9 4 21.8 4.31 20.7 5.25 L 14 10.33 L 14 12 L 34 12
           L 34 10.33 L 27.3 5.25 C 26.1 4.25 25 4 24 4 Z
           M 24 6.5 A 2 2 0 1 0 24 6.501 Z"/>

  <!-- 5. Clip highlight (white 15%) -->
  <path style="fill:#ffffff;opacity:0.15"
        d="M 24 4 C 22.9 4 21.8 4.31 20.7 5.25 L 20 5.85
           C 21.2 4.85 22.5 4.5 24 4.5 C 25.5 4.5 26.8 4.85 28 5.85
           L 27.3 5.25 C 26.1 4.25 25 4 24 4 Z"/>

  <!-- 6. Ceibo leaf: white silhouette + olive spine + olive lateral veins -->
  <!-- Leaf body -->
  <path style="fill:#ffffff"
        d="M 24 15 C 32 17.5 34 29 30 35.5 C 28 38.5 26 40.5 24 40.5
           C 22 40.5 20 38.5 18 35.5 C 14 29 16 17.5 24 15 Z"/>
  <!-- Midrib spine -->
  <rect style="fill:#7a8c5a;opacity:0.65" x="23.2" y="16" width="1.6" height="24" rx="0.8" ry="0.8"/>
  <!-- Upper lateral vein pair -->
  <path style="fill:#7a8c5a;opacity:0.6"
        d="M 23.2 22 L 15.5 27 L 15.5 28.4 L 23.2 23.4 Z
           M 24.8 22 L 32.5 27 L 32.5 28.4 L 24.8 23.4 Z"/>
  <!-- Lower lateral vein pair -->
  <path style="fill:#7a8c5a;opacity:0.6"
        d="M 23.2 30 L 17 34.5 L 17 35.9 L 23.2 31.4 Z
           M 24.8 30 L 31 34.5 L 31 35.9 L 24.8 31.4 Z"/>
</svg>
