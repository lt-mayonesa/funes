<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Funes — clipboard app icon">
  <defs>
    <linearGradient id="clipBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3A4F"/>
      <stop offset="1" stop-color="#141A24"/>
    </linearGradient>
    <linearGradient id="clipBoard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBF3"/>
      <stop offset="1" stop-color="#EEE2CD"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#clipBg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- ghost of the previous copy -->
  <rect x="78" y="62" width="112" height="150" rx="22" fill="#F2B33D" transform="translate(22 -12)"/>

  <!-- board -->
  <rect x="62" y="62" width="112" height="150" rx="22" fill="url(#clipBoard)"/>
  <!-- clip -->
  <rect x="92" y="44" width="52" height="34" rx="13" fill="#2E3A4F"/>
  <rect x="103" y="34" width="30" height="22" rx="11" fill="#2E3A4F"/>

  <!-- content: newest line highlighted -->
  <rect x="84" y="102" width="68" height="12" rx="6" fill="#E08E1B"/>
  <rect x="84" y="130" width="68" height="12" rx="6" fill="#2E3A4F" opacity="0.30"/>
  <rect x="84" y="158" width="46" height="12" rx="6" fill="#2E3A4F" opacity="0.30"/>
  <rect x="84" y="186" width="56" height="12" rx="6" fill="#2E3A4F" opacity="0.30"/>
</svg>
