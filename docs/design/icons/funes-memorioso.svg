<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Funes — el memorioso app icon">
  <defs>
    <linearGradient id="memBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303A52"/>
      <stop offset="1" stop-color="#151A26"/>
    </linearGradient>
    <linearGradient id="memSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFBF3"/>
      <stop offset="1" stop-color="#EADFCB"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#memBg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <g transform="translate(-6 8)">
