name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build & test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: ['24.04', '22.04']

    steps:
      - name: Install build dependencies
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git \
            meson ninja-build gettext \
            desktop-file-utils libglib2.0-bin libglib2.0-dev-bin \
            python3 python3-gi python3-xlib gir1.2-gtk-3.0 \
            devscripts debhelper dpkg-dev fakeroot lintian

      - uses: actions/checkout@v7

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: meson setup _build --prefix=/usr

      - name: Test
        run: meson test -C _build --print-errorlogs

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: meson-logs-${{ matrix.distro }}
          path: _build/meson-logs/
          retention-days: 7

      - name: Compute package version
        id: version
        run: |
          set -eux
          version="$(./scripts/project-version.sh)"
          short="$(git rev-parse --short HEAD)"
          echo "deb_version=${version}~ubuntu${{ matrix.distro }}+git${short}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: |
          set -eux
          ./scripts/set-deb-version.sh "${{ steps.version.outputs.deb_version }}" unstable \
            "CI build of ${{ github.sha }}."
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          mv ../*.deb dist/

      - name: Run lintian (report only)
        continue-on-error: true
        run: lintian dist/*.deb || true

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: funes-deb-ubuntu${{ matrix.distro }}
          path: dist/*.deb
          retention-days: 7

  lint:
    name: lint & data validation
    runs-on: ubuntu-latest
    container: ubuntu:24.04

    steps:
      - name: Install dependencies
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git \
            meson ninja-build gettext python3 \
            desktop-file-utils libglib2.0-bin libglib2.0-dev-bin

      - uses: actions/checkout@v7

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Byte-compile all sources
        run: python3 -m compileall -q app funes tests

      - name: Validate desktop entry
        run: |
          set -eux
          meson setup _lint --prefix=/usr
          meson compile -C _lint
          desktop-file-validate _lint/data/org.x.funes.desktop

      - name: Validate GSettings schema
        run: glib-compile-schemas --strict --dry-run data/
