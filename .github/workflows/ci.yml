name: CI

# Every commit: format, lint, bugcheck, build, test, package.
#   push to main        -> refresh the rolling `beta` pre-release
#   pull request        -> publish an alpha .deb artifact and link it in the PR
#   push of a v* tag    -> checks only; release.yml does the shipping
#
# Topic branches are covered by the pull_request trigger only: listing them
# under `push` too made every PR branch run CI twice.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are pointless; main runs publish assets, so let them finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: format, lint & bugcheck
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dev tooling
        run: uv sync --group dev --frozen

      - name: Format (ruff format --check)
        run: uv run ruff format --check --diff .

      - name: Lint (ruff check)
        run: uv run ruff check --output-format github .

      - name: Bugcheck (mypy --strict)
        run: uv run mypy

      - name: Bugcheck (bandit)
        run: uv run bandit -c pyproject.toml -r app funes -ll

  version:
    name: compute version suffix
    runs-on: ubuntu-24.04
    outputs:
      suffix: ${{ steps.suffix.outputs.suffix }}
      message: ${{ steps.suffix.outputs.message }}
      channel: ${{ steps.suffix.outputs.channel }}
      version: ${{ steps.suffix.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      # `~` sorts before everything in dpkg, so a pre-release version always
      # upgrades cleanly to the final release of the same number.
      - name: Derive suffix
        id: suffix
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN: ${{ github.run_number }}
        run: |
          set -eu
          short="${HEAD_SHA:0:7}"
          if [ "$EVENT" = "pull_request" ]; then
            channel=alpha
            suffix="~alpha.pr${PR_NUMBER}.${RUN}.g${short}"
            message="Alpha build of PR #${PR_NUMBER} (${short})."
          elif [ "$EVENT" = "push" ] && [ "$REF_NAME" = "main" ]; then
            channel=beta
            suffix="~beta.${RUN}.g${short}"
            message="Beta build of ${short}."
          else
            channel=none
            suffix="~ci.${RUN}.g${short}"
            message="CI build of ${REF_NAME} (${short})."
          fi
          base="$(./scripts/project-version.sh)"
          {
            echo "channel=$channel"
            echo "suffix=$suffix"
            echo "message=$message"
            # Version of the package that actually gets published (24.04 base).
            echo "version=${base}${suffix}~ubuntu24.04"
          } >> "$GITHUB_OUTPUT"

  build:
    name: package
    needs: version
    uses: ./.github/workflows/build-deb.yml
    with:
      version-suffix: ${{ needs.version.outputs.suffix }}
      changelog-message: ${{ needs.version.outputs.message }}
      artifact-prefix: funes-${{ needs.version.outputs.channel }}-deb
      retention-days: 14

  beta:
    name: publish beta pre-release
    # Gate: nothing ships unless format, lint, bugcheck, tests and lintian pass.
    needs: [checks, version, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: funes-beta-deb-ubuntu24.04
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          set -eux
          sha256sum *.deb > SHA256SUMS
          cat SHA256SUMS

      # The rolling `beta` tag is force-moved; the push filters above ignore it
      # (only v* tags trigger CI), so this cannot loop.
      - name: Move the beta tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git tag --force beta "$GITHUB_SHA"
          git push --force origin refs/tags/beta

      - name: Refresh the beta pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eux
          notes="$(printf '%s\n' \
            "Rolling build of \`main\`. Overwritten on every push - do not link to it." \
            "" \
            "- commit: \`$GITHUB_SHA\`" \
            "- version: \`$VERSION\`" \
            "- workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          if gh release view beta >/dev/null 2>&1; then
            # Replace assets: the release must only ever hold the latest build.
            for asset in $(gh release view beta --json assets --jq '.assets[].name'); do
              gh release delete-asset beta "$asset" --yes
            done
            gh release edit beta --prerelease --title "Beta (main)" --notes "$notes"
          else
            gh release create beta --prerelease --title "Beta (main)" --notes "$notes"
          fi
          gh release upload beta dist/* --clobber

  alpha:
    name: link alpha artifact in the PR
    needs: [checks, version, build]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write

    steps:
      - name: Comment with the alpha artifact
        # Forked PRs get a read-only token, so the artifact is uploaded but not
        # announced. The Checks tab still links it.
        if: github.event.pull_request.head.repo.fork == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eux
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > body.md <<EOF
          <!-- funes-alpha-artifact -->
          ### Alpha build ready

          | | |
          |---|---|
          | version | \`$VERSION\` |
          | commit | \`${{ github.event.pull_request.head.sha }}\` |
          | artifact | [funes-alpha-deb-ubuntu24.04]($run_url#artifacts) (14 days) |

          \`\`\`sh
          gh run download $GITHUB_RUN_ID -n funes-alpha-deb-ubuntu24.04
          sudo apt install ./funes_*.deb
          \`\`\`
          EOF
          gh pr comment "$PR" --body-file body.md --edit-last --create-if-none
