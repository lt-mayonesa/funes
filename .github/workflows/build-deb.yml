name: build deb

# Reusable: builds and tests Funes on every supported Ubuntu base, packages a
# .deb per base and runs lintian over the results. Callers only decide which
# ref to build and which version suffix to stamp into debian/changelog.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build (default: the triggering ref)'
        required: false
        type: string
        default: ''
      version-suffix:
        description: 'Appended to the meson version, e.g. "~beta.12.gdeadbee"'
        required: false
        type: string
        default: ''
      changelog-message:
        description: 'debian/changelog entry body'
        required: false
        type: string
        default: 'Automated build.'
      append-distro:
        description: 'Append ~ubuntu<base> to the package version'
        required: false
        type: boolean
        default: true
      artifact-prefix:
        description: 'Artifact name prefix; one artifact per Ubuntu base'
        required: false
        type: string
        default: 'funes-deb'
      retention-days:
        description: 'Artifact retention'
        required: false
        type: number
        default: 7

permissions:
  contents: read

jobs:
  package:
    name: build, test & package (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        # 22.04 (Mint 21) is proven to build; the Architecture: all package
        # from 24.04 is the one that gets shipped.
        distro: ['24.04', '22.04']
    steps:
      - name: Install build dependencies
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates git \
            meson ninja-build gettext \
            desktop-file-utils libglib2.0-bin libglib2.0-dev-bin \
            python3 python3-gi python3-xlib gir1.2-gtk-3.0 \
            devscripts debhelper dpkg-dev fakeroot

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: meson setup _build --prefix=/usr

      - name: Test
        run: meson test -C _build --print-errorlogs

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: meson-logs-${{ matrix.distro }}
          path: _build/meson-logs/
          retention-days: 7

      - name: Validate desktop entry and GSettings schema
        run: |
          set -eux
          meson compile -C _build
          desktop-file-validate _build/data/org.x.funes.desktop
          glib-compile-schemas --strict --dry-run data/

      - name: Compute package version
        id: version
        run: |
          set -eux
          version="$(./scripts/project-version.sh)"
          suffix='${{ inputs.version-suffix }}'
          if [ '${{ inputs.append-distro }}' = 'true' ]; then
            suffix="${suffix}~ubuntu${{ matrix.distro }}"
          fi
          echo "deb_version=${version}${suffix}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: |
          set -eux
          ./scripts/set-deb-version.sh "${{ steps.version.outputs.deb_version }}" unstable \
            '${{ inputs.changelog-message }}'
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          mv ../*.deb dist/
          ls -l dist

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-ubuntu${{ matrix.distro }}
          path: dist/*.deb
          retention-days: ${{ inputs.retention-days }}

  lintian:
    name: lintian
    needs: package
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-prefix }}-*
          merge-multiple: true
          path: dist

      - name: Install lintian
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lintian

      # Errors block the build; warnings and info tags are reported only.
      - name: Run lintian
        run: lintian --fail-on error --info dist/*.deb
