name: Release

# Assets are attached to a release you publish from the GitHub UI or with
# `gh release create`. This workflow never creates or edits the release itself,
# so the notes stay entirely yours.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of an existing published release (e.g. v0.2.0)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: ['24.04', '22.04']

    steps:
      - name: Install build dependencies
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates git \
            meson ninja-build gettext \
            desktop-file-utils libglib2.0-bin libglib2.0-dev-bin \
            python3 python3-gi python3-xlib gir1.2-gtk-3.0 \
            devscripts debhelper dpkg-dev fakeroot

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check tag matches meson.build version
        id: version
        run: |
          set -eux
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          tag_version="${tag#v}"
          meson_version="$(./scripts/project-version.sh)"
          if [ "$tag_version" != "$meson_version" ]; then
            echo "::error::tag $tag declares version $tag_version but meson.build says $meson_version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -eux
          meson setup _build --prefix=/usr
          meson test -C _build --print-errorlogs

      - name: Build .deb
        run: |
          set -eux
          ./scripts/set-deb-version.sh "${{ steps.version.outputs.version }}" unstable \
            "Release ${{ steps.version.outputs.tag }}."
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          for deb in ../*.deb; do
            base="$(basename "$deb" .deb)"
            mv "$deb" "dist/${base}_ubuntu${{ matrix.distro }}.deb"
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-deb-ubuntu${{ matrix.distro }}
          path: dist/*.deb
          retention-days: 7

  lintian:
    name: lintian (report only)
    needs: package
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-deb-*
          merge-multiple: true
          path: dist

      - name: Install lintian
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lintian

      - name: Run lintian
        run: lintian dist/*.deb || true

  release:
    name: attach assets to the release
    needs: package
    runs-on: ubuntu-24.04

    steps:
      # The package is Architecture: all and installs on both bases; the 22.04
      # job exists to prove it still builds there, not to ship a second deb.
      - uses: actions/download-artifact@v8
        with:
          name: release-deb-ubuntu24.04
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          set -eux
          sha256sum *.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eux
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::no release found for tag $tag; publish it first" >&2
            exit 1
          fi
          gh release upload "$tag" dist/* --clobber
