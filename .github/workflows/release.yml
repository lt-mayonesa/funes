name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for (e.g. v0.1.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: ['24.04', '22.04']

    steps:
      - name: Install build dependencies
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates git \
            meson ninja-build pkg-config valac \
            desktop-file-utils libglib2.0-bin \
            libglib2.0-dev libgtk-3-dev libxapp-dev libx11-dev libxtst-dev \
            devscripts debhelper dpkg-dev fakeroot lintian

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check tag matches meson.build version
        id: version
        run: |
          set -eux
          tag="${{ inputs.tag || github.ref_name }}"
          tag_version="${tag#v}"
          meson_version="$(./scripts/project-version.sh)"
          if [ "$tag_version" != "$meson_version" ]; then
            echo "::error::tag $tag declares version $tag_version but meson.build says $meson_version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -eux
          meson setup _build --prefix=/usr
          meson compile -C _build
          meson test -C _build --print-errorlogs

      - name: Build .deb
        run: |
          set -eux
          ./scripts/set-deb-version.sh "${{ steps.version.outputs.version }}" unstable \
            "Release ${{ steps.version.outputs.tag }}."
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          for deb in ../*.deb; do
            base="$(basename "$deb" .deb)"
            mv "$deb" "dist/${base}_ubuntu${{ matrix.distro }}.deb"
          done
          ls -l dist

      - name: Run lintian (report only)
        continue-on-error: true
        run: lintian dist/*.deb || true

      - uses: actions/upload-artifact@v4
        with:
          name: release-deb-ubuntu${{ matrix.distro }}
          path: dist/*.deb
          retention-days: 7

  release:
    name: publish GitHub release
    needs: package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: release-deb-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          set -eux
          sha256sum *.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          tag="${{ inputs.tag || github.ref_name }}"
          args=(--title "$tag" --generate-notes)
          case "$tag" in
            *-rc*|*-beta*|*-alpha*) args+=(--prerelease) ;;
          esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* "${args[@]}"
          fi
