name: Release

# Assets are attached to a release you publish from the GitHub UI or with
# `gh release create`. This workflow never creates or edits the release body,
# so the notes stay entirely yours.
#
# It only ships commits that already went green on CI: the tag must point at a
# commit with a successful CI run (build, test, format, lint, bugcheck,
# lintian). The .deb is then rebuilt from that exact commit so the shipped
# package carries the clean release version instead of a `~beta` one.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of an existing published release (e.g. v0.2.0)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: verify tag and CI status
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Check tag, version and CI result
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -eux
          tag_version="${TAG#v}"
          meson_version="$(./scripts/project-version.sh)"
          if [ "$tag_version" != "$meson_version" ]; then
            echo "::error::tag $TAG declares version $tag_version but meson.build says $meson_version"
            exit 1
          fi

          sha="$(git rev-parse HEAD)"
          runs="$(gh api \
            "repos/${GH_REPO}/actions/workflows/ci.yml/runs?head_sha=${sha}&status=success" \
            --jq '.total_count')"
          if [ "$runs" -lt 1 ]; then
            echo "::error::no successful CI run for $sha; tag a commit whose beta build went green"
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "version=$tag_version"
          } >> "$GITHUB_OUTPUT"

  package:
    name: rebuild release package
    needs: gate
    uses: ./.github/workflows/build-deb.yml
    with:
      ref: ${{ needs.gate.outputs.tag }}
      append-distro: false
      changelog-message: Release ${{ needs.gate.outputs.tag }}.
      artifact-prefix: funes-release-deb
      retention-days: 30

  publish:
    name: attach assets to the release
    needs: [gate, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # The package is Architecture: all and installs on both bases; the 22.04
      # job exists to prove it still builds there, not to ship a second deb.
      - uses: actions/download-artifact@v8
        with:
          name: funes-release-deb-ubuntu24.04
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          set -eux
          sha256sum *.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -eux
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::no release found for tag $TAG; publish it first"
            exit 1
          fi
          gh release upload "$TAG" dist/* --clobber
