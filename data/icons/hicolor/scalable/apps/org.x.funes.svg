<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="256" height="256" role="img" aria-label="Funes — clipboard history">
  <!-- Ceibo leaf: the blade is one filled contour, the venation is cut out of it
       (fill-rule evenodd), so the mark survives being flattened to a silhouette.
       No background: the icon is drawn on whatever surface the theme provides,
       hence a mid-tone green that holds contrast on both light and dark. -->
  <g id="glyph" transform="translate(512,512) scale(1.1) rotate(-45) translate(-512,-512)">
    <path id="blade" fill="#3E8C5A" fill-rule="evenodd"
          d="M 512 215 C 790 360 810 640 512 830 C 214 640 234 360 512 215 Z
             M 496 290 L 528 290 L 528 800 L 496 800 Z
             M 528 480 L 654 402 L 654 434 L 528 512 Z
             M 528 650 L 622 580 L 622 612 L 528 682 Z
             M 496 480 L 370 402 L 370 434 L 496 512 Z
             M 496 650 L 402 580 L 402 612 L 496 682 Z"/>
    <g id="nodes" fill="#D6453C">
      <circle cx="660" cy="418" r="30"/>
      <circle cx="628" cy="596" r="30"/>
      <circle cx="364" cy="418" r="30"/>
      <circle cx="396" cy="596" r="30"/>
    </g>
  </g>
</svg>
