<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16">
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color:#dfdfdf; }
    </style>
  </defs>
  <!--
    Panel symbolic for Funes — ceibo leaf growing out of the clipboard clip bar.
    Leaf and clip tab are one connected silhouette; a spine slot (evenodd) marks
    it as a leaf.  Fill-only, no strokes.  Designed for @2x panel (32 px).
  -->
  <path style="fill:currentColor" class="ColorScheme-Text"
        fill-rule="evenodd"
        d="M 8 1
           C 10.2 2 11.2 5 10.5 8
           L 10.5 9.5
           L 14.5 9.5
           Q 15 9.5 15 10
           L 15 12.5
           Q 15 13 14.5 13
           L 1.5 13
           Q 1 13 1 12.5
           L 1 10
           Q 1 9.5 1.5 9.5
           L 5.5 9.5
           L 5.5 8
           C 4.8 5 5.8 2 8 1
           Z
           M 7.65 2.5 L 8.35 2.5 L 8.35 8.5 L 7.65 8.5 Z"/>
</svg>
