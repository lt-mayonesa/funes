<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Funes — clipboard history">
  <!-- GTK recolours symbolic icons by injecting `fill` rules over path/rect/circle
       and never touches `stroke`, so this mark is filled paths only: one blade with
       the midrib and one vein pair knocked out (fill-rule evenodd). Three cuts is
       the cap - anything denser turns to mush at panel size. Same -45° axis and
       same blade curve as the colour icon. -->
  <path fill="currentColor" fill-rule="evenodd" transform="rotate(-45 8 8)"
        d="M 8 2.66 C 12.99 5.27 13.36 10.3 8 13.72 C 2.64 10.3 3.01 5.27 8 2.66 Z
           M 7.71 4.01 L 8.29 4.01 L 8.29 13.18 L 7.71 13.18 Z
           M 8.29 7.43 L 10.55 6.02 L 10.55 6.6 L 8.29 8 Z
           M 7.71 7.43 L 5.45 6.02 L 5.45 6.6 L 7.71 8 Z"/>
</svg>
